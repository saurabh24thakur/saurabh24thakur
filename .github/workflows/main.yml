name: Profile Automation

on:
  # Schedule updates every 12 hours
  schedule: [{cron: "0 */12 * * *"}]
  # Allows you to run it manually from the Actions tab
  workflow_dispatch:
  # Run on every push to the master/main branch
  push: {branches: ["master", "main"]}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. Generate the Metrics Dashboard (Saves to the root of your repo)
      - name: GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: saurabh24thakur
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          filename: github-metrics.svg

      # 2. Generate the Contribution Snake (Saves to a 'dist' folder)
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: saurabh24thakur
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}

      # 3. Push the Snake files to a separate branch called 'output'
      - name: Push Snake to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
